<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>同じ一つ分を 図にしよう</title><link rel="stylesheet" href="style.css"><style>main{max-width:1000px;margin:auto;padding:16px}.groupTools{display:flex;gap:12px;flex-wrap:wrap}.groupFigure{width:100%;height:auto}.groupArc{fill:none;stroke:#485d69;stroke-width:2}.groupTape{fill:#d9effb;stroke:#2478b5;stroke-width:2}.groupText{font:32px Meiryo,sans-serif;fill:#26384c}.groupHit{fill:transparent;cursor:pointer}.selected{outline:3px solid #18775e}#status{min-height:2em}</style></head>
<body><main><h1>同じ一つ分を 図にしよう</h1><form id="groupsSettings" hidden><label>聞きたい量<select id="groupsUnknown"><option value="total">ぜんぶ</option><option value="a">一皿分</option><option value="b">お皿の数</option></select></label><details><summary>先生の数の設定</summary><label>一皿分<input id="groupsA" type="number" min="1" max="12" value="3" required></label><label>お皿の数<input id="groupsB" type="number" min="1" max="12" value="4" required></label><button type="submit">この数でつくる</button></details><a href="index.html">○・テープ図の教材へ</a></form><div id="story"></div><h2 id="prompt"></h2><p id="hint"></p><div id="tools" class="groupTools"></div><div id="figure"></div><p id="status" role="status" aria-live="polite"></p><div class="groupTools"><button id="check" hidden>図を たしかめる</button><button id="restart">もう一度つくる</button><button id="back">この図を お話へもどす</button></div></main><script src="groups.js"></script></body></html>
